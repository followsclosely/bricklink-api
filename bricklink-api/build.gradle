plugins {
    id 'java'
    id 'io.freefair.lombok' version '9.0.0'
    id 'signing'
    id 'maven-publish'
}

dependencies {

    // jackson-annotations is unchanged in Jackson 3 (still on com.fasterxml.jackson groupId)
    implementation('com.fasterxml.jackson.core:jackson-annotations:2.22')
    implementation('tools.jackson.dataformat:jackson-dataformat-xml:3.1.4')
    implementation('org.apache.commons:commons-text:1.15.0')

    // For testing
    testImplementation('tools.jackson.core:jackson-databind:3.1.4')
    testImplementation('org.junit.jupiter:junit-jupiter-api:5.11.0')

    testRuntimeOnly('org.junit.jupiter:junit-jupiter-engine:5.11.0')
}

tasks.register('sourcesJar', Jar as Class<Task>) {
    from sourceSets.main.allJava
    archiveClassifier.set('sources')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact tasks.sourcesJar
        }
    }
}

test {
    useJUnitPlatform()
}
