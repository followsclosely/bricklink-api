plugins {
    id 'java'
    id 'maven-publish'
    id 'io.freefair.lombok' version '9.0.0'
}

dependencies {

    implementation('org.slf4j:slf4j-api:2.0.17')
    implementation('io.github.followsclosely:toolbox-spring-web:1.0.0')


    compileOnly('org.springframework:spring-web:7.0.8')
    compileOnly("org.springframework.boot:spring-boot:4.1.0")
    compileOnly('org.springframework.boot:spring-boot-autoconfigure:4.1.0')

    compileOnly(project(':bricklink-api'))
    compileOnly(project(':bricklink-catalog-loaders'))
    compileOnly(project(':bricklink-spring-rest-client'))

}

tasks.register('sourcesJar', Jar) {
    from sourceSets.main.allJava
    archiveClassifier.set('sources')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact tasks.sourcesJar
        }
    }
}
